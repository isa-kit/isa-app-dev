<!doctype html>
<!--
  Apex landing page (devisant.com / dev.devisant.com). A deliberate DECOY:
  reads as a small, dry, unremarkable personal website — Home/About/FAQ,
  nothing else. It must never reference the platform, tools, applets, or
  data; the real app lives at unlinked paths and is reached by direct link
  only. Sibling pages: about.html, faq.html (served extensionless by the
  host: /about, /faq). Their names are RESERVED applet ids — adding a new
  page here means adding its name to tool/write_standalone_apps.sh.
  Deploy copies every file beside this one to the artifact root.
-->
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="devisant — a website.">
<title>devisant</title>
<link rel="stylesheet" href="/site.css">
</head>
<body>
<main>
  <h1 class="wordmark">devisant</h1>
  <p class="lede">A website.</p>

  <nav class="sitenav">
    <a href="/" aria-current="page">home</a>
    <a href="/about">about</a>
    <a href="/faq">faq</a>
  </nav>

  <section>
    <h2>Welcome</h2>
    <p>
      You have reached devisant.com. This is its home page. Not a great deal
      happens here, but it happens consistently.
    </p>
  </section>

  <section>
    <h2>News</h2>
    <p class="muted">
      There is no news. This is widely considered a good thing.
    </p>
  </section>
</main>
</body>
</html>
